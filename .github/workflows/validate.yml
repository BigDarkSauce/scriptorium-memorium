name: Validate Scriptorium

on:
  push:
    branches:
      - feature/openai-diorama-atlas
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  model-and-source-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test source-mapped simulation contracts
        run: node tools/test-model-contract.mjs

      - name: Verify representative source chain
        run: node tools/verify-chain.mjs tools/fixtures/byu-stub/chain-01.json

      - name: Verify built-in diorama plans
        run: node tools/verify-chain.mjs --builtins
